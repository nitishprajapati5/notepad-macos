name: 🐛 Bug Report
description: Report a reproducible problem or crash in Notepad for macOS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much information as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I open a large text file (>50MB), the line numbers overlap with...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Launch Notepad.app
        2. Open a file with CRLF line endings
        3. Switch to Dark Mode
        4. Observe the status bar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Mac Architecture
      description: What processor architecture does your Mac use?
      options:
        - Apple Silicon (arm64 - M1/M2/M3/M4/M5)
        - Intel (x86_64)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: e.g., macOS 14.5 Sonoma, macOS 15.0 Sequoia, macOS 13 Ventura
      placeholder: macOS 14.5 Sonoma
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Notepad Version
      description: e.g., 1.0.0 (found in Notepad -> About Notepad or via git commit hash)
      placeholder: 1.0.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs, Crash Reports, or Screenshots
      description: Paste any crash reports, Console app output, or drag-and-drop screenshots/screen recordings here.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest released version or latest `main` branch.
          required: false
