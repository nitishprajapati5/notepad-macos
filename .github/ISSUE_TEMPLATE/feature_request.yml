name: 💡 Feature Request
description: Propose an enhancement, new feature, or UX improvement for Notepad for macOS
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We love hearing new ideas! Please describe the feature you would like to see and why it would be valuable.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: I am always frustrated when trying to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A detailed description of what you want to happen and how it should look or behave.
      placeholder: Add a menu item or keyboard shortcut that allows...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Mockups
      description: Add any mockups, screenshots, or references to Windows Notepad or other text editors.
    validations:
      required: false
  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature.
          required: false
