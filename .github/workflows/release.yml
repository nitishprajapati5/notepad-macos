name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Package Universal App Bundle
        run: make package

      - name: Verify Release Assets
        run: |
          test -f build/Notepad-macOS.dmg
          test -f build/Notepad-macOS-Universal.zip
          test -f build/checksums.txt
          cat build/checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Notepad-macOS.dmg
            build/Notepad-macOS-Universal.zip
            build/checksums.txt
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
